services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: webpos
      POSTGRES_PASSWORD: webpos
      POSTGRES_DB: webpos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webpos -d webpos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
